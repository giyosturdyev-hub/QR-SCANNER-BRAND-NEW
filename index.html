<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>QR Сканер</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"
    type="text/javascript"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
    }

    .card {
      background: #fff;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      margin-bottom: 16px;
    }

    h2 {
      margin-top: 0;
      text-align: center;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 17px;
      border: 1px solid #bbb;
      border-radius: 7px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: none;
      border-radius: 7px;
      background: #1976d2;
      color: white;
    }

    button:active {
      opacity: .8;
    }

    .hidden {
      display: none !important;
    }

    .session-info {
      text-align: center;
      line-height: 1.6;
      font-size: 17px;
    }

    .counter {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin: 12px 0;
    }

    #reader {
      width: 100%;
      margin-top: 12px;
    }

    #reader video {
      border-radius: 10px;
    }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 7px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .success {
      background: #d9f7df;
      color: #176b2c;
    }

    .error {
      background: #ffdede;
      color: #a00000;
    }

    .warning {
      background: #fff0c2;
      color: #795600;
    }

    .info {
      background: #e0ecff;
      color: #174d9c;
    }

    .loading {
      text-align: center;
      margin-top: 10px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>QR Сканер</h1>

  <!-- LOGIN -->

  <div id="loginScreen" class="card">

    <label for="password">Пароль</label>

    <input
      id="password"
      type="password"
      placeholder="Введите пароль"
      autocomplete="off"
    >

    <button id="loginButton" onclick="login()">
      Войти
    </button>

    <div id="loginStatus"></div>

  </div>


  <!-- WORKER -->

  <div id="workerScreen" class="card hidden">

    <h2>Данные исполнителя</h2>

    <label for="executor">
      Имя исполнителя
    </label>

    <input
      id="executor"
      type="text"
      placeholder="Введите имя"
      autocomplete="off"
    >

    <label for="du">
      ДУ прибора
    </label>

    <input
      id="du"
      type="text"
      placeholder="Введите ДУ"
      autocomplete="off"
    >

    <button onclick="startScanner()">
      Начать сканирование
    </button>

    <div id="workerStatus"></div>

  </div>


  <!-- SCANNER -->

  <div id="scannerScreen" class="hidden">

    <div class="card">

      <div class="session-info">

        Исполнитель:
        <strong id="executorDisplay"></strong>

        <br>

        ДУ:
        <strong id="duDisplay"></strong>

      </div>

      <div class="counter">
        Отсканировано:
        <span id="counter">0</span>
      </div>

      <div id="reader"></div>

      <div id="scannerLoading" class="loading">
        Запуск камеры...
      </div>

      <div id="scanStatus"></div>

    </div>

  </div>

</div>


<script>

  // =====================================================
  // GOOGLE APPS SCRIPT
  // =====================================================

  const GOOGLE_SCRIPT_URL =
    'https://script.google.com/macros/s/AKfycby5GSmAT8_eINQTh7ToOjli0urAyAmk8L2Ia1nkkNRrTXs-gyS_A08-QzMpgcPveWC2zA/exec';


  // =====================================================
  // ПЕРЕМЕННЫЕ
  // =====================================================

  let executor = '';

  let du = '';

  let scanner = null;

  let processingScan = false;

  let scanCount = 0;

  let lastScannedText = '';

  let lastScanTime = 0;


  // =====================================================
  // ЗАПРОС К GOOGLE APPS SCRIPT
  // =====================================================

  async function callGoogleScript(action, data = {}) {

    const params = new URLSearchParams();

    params.set('action', action);

    Object.keys(data).forEach(function(key) {

      params.set(key, data[key]);

    });


    const controller =
      new AbortController();


    const timeout =
      setTimeout(function() {

        controller.abort();

      }, 10000);


    try {

      const response =
        await fetch(
          GOOGLE_SCRIPT_URL +
          '?' +
          params.toString(),
          {
            method: 'GET',
            cache: 'no-store',
            signal: controller.signal
          }
        );


      if (!response.ok) {

        throw new Error(
          'HTTP ' + response.status
        );

      }


      return await response.json();

    } finally {

      clearTimeout(timeout);

    }

  }


  // =====================================================
  // ВХОД
  // =====================================================

  async function login() {

    const password =
      document
        .getElementById('password')
        .value
        .trim();


    if (!password) {

      showStatus(
        'loginStatus',
        'Введите пароль.',
        'error'
      );

      return;

    }


    const button =
      document.getElementById('loginButton');


    button.disabled = true;

    button.textContent = 'Проверка...';


    try {

      const result =
        await callGoogleScript(
          'checkPassword',
          {
            password: password
          }
        );


      if (result.success) {

        document
          .getElementById('loginScreen')
          .classList.add('hidden');


        document
          .getElementById('workerScreen')
          .classList.remove('hidden');


      } else {

        showStatus(
          'loginStatus',
          'Неверный пароль.',
          'error'
        );

      }


    } catch (error) {

      showStatus(
        'loginStatus',
        'Нет связи со скриптом. Повторите попытку.',
        'error'
      );

    } finally {

      button.disabled = false;

      button.textContent = 'Войти';

    }

  }


  // =====================================================
  // НАЧАЛО СКАНИРОВАНИЯ
  // =====================================================

  function startScanner() {

    executor =
      document
        .getElementById('executor')
        .value
        .trim();


    du =
      document
        .getElementById('du')
        .value
        .trim();


    if (!executor) {

      showStatus(
        'workerStatus',
        'Введите имя исполнителя.',
        'error'
      );

      return;

    }


    if (!du) {

      showStatus(
        'workerStatus',
        'Введите ДУ прибора.',
        'error'
      );

      return;

    }


    document
      .getElementById('workerScreen')
      .classList.add('hidden');


    document
      .getElementById('scannerScreen')
      .classList.remove('hidden');


    document
      .getElementById('executorDisplay')
      .textContent = executor;


    document
      .getElementById('duDisplay')
      .textContent = du;


    /*
      ВАЖНО:

      Камеру запускаем СРАЗУ.

      Счётчик запрашиваем параллельно.
    */

    startQrScanner();

    loadCounter();

  }


  // =====================================================
  // ЗАГРУЗКА СЧЁТЧИКА
  // =====================================================

  async function loadCounter() {

    try {

      const result =
        await callGoogleScript(
          'getScanCount'
        );


      if (result.success) {

        scanCount =
          Number(result.count) || 0;


        document
          .getElementById('counter')
          .textContent =
          scanCount;

      }

    } catch (error) {

      /*
        Камера продолжает работать,
        даже если Google временно недоступен.
      */

      showStatus(
        'scanStatus',
        'Счётчик временно не обновился.',
        'warning'
      );

    }

  }


  // =====================================================
  // ЗАПУСК КАМЕРЫ
  // =====================================================

  async function startQrScanner() {

    if (scanner) {

      try {

        await scanner.stop();

      } catch (e) {

        // ничего

      }

      scanner = null;

    }


    scanner =
      new Html5Qrcode('reader');


    const config = {

      fps: 8,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(width, height) * 0.65
          );


        return {
          width: size,
          height: size
        };

      },

      aspectRatio: 1.0,

      disableFlip: false

    };


    try {

      await scanner.start(

        {
          facingMode: {
            exact: 'environment'
          }
        },

        config,

        onScanSuccess,

        onScanFailure

      );


      document
        .getElementById('scannerLoading')
        .classList.add('hidden');


      showStatus(
        'scanStatus',
        'Камера готова. Наведите её на QR-код.',
        'info'
      );


    } catch (error) {

      /*
        Если exact environment не поддерживается,
        пробуем обычный environment.
      */

      try {

        await scanner.start(

          {
            facingMode: 'environment'
          },

          config,

          onScanSuccess,

          onScanFailure

        );


        document
          .getElementById('scannerLoading')
          .classList.add('hidden');


        showStatus(
          'scanStatus',
          'Камера готова. Наведите её на QR-код.',
          'info'
        );


      } catch (secondError) {

        document
          .getElementById('scannerLoading')
          .textContent =
          'Не удалось запустить камеру.';


        showStatus(
          'scanStatus',
          'Не удалось получить доступ к камере.',
          'error'
        );

      }

    }

  }


  // =====================================================
  // УСПЕШНОЕ СКАНИРОВАНИЕ
  // =====================================================

  async function onScanSuccess(decodedText) {

    const serialNumber =
      String(decodedText || '').trim();


    if (!serialNumber) {

      return;

    }


    /*
      Защита от того, что камера
      несколько раз подряд отдаёт
      один и тот же QR.
    */

    const now =
      Date.now();


    if (
      serialNumber === lastScannedText &&
      now - lastScanTime < 2500
    ) {

      return;

    }


    lastScannedText =
      serialNumber;

    lastScanTime =
      now;


    /*
      Пока предыдущий запрос
      не закончился, новый не отправляем.
    */

    if (processingScan) {

      return;

    }


    processingScan = true;


    showStatus(
      'scanStatus',
      'Проверяем ' + serialNumber + '...',
      'info'
    );


    try {

      const result =
        await callGoogleScript(

          'addScan',

          {
            serialNumber: serialNumber,
            du: du,
            executor: executor
          }

        );


      if (result.success) {

        scanCount =
          Number(result.count);


        document
          .getElementById('counter')
          .textContent =
          scanCount;


        showStatus(
          'scanStatus',
          '✓ Код добавлен: ' +
          result.serialNumber,
          'success'
        );


      } else if (result.duplicate) {

        /*
          При дубле счётчик
          НЕ увеличиваем.
        */

        if (
          typeof result.count !== 'undefined'
        ) {

          scanCount =
            Number(result.count);


          document
            .getElementById('counter')
            .textContent =
            scanCount;

        }


        showStatus(
          'scanStatus',
          '⚠ Такой номер уже есть: ' +
          result.serialNumber,
          'warning'
        );


      } else {

        showStatus(
          'scanStatus',
          result.message ||
          'Ошибка при записи.',
          'error'
        );

      }


    } catch (error) {

      showStatus(
        'scanStatus',
        'Нет связи со скриптом. ' +
        'Повторите сканирование.',
        'error'
      );

    } finally {

      processingScan = false;

    }

  }


  // =====================================================
  // ОШИБКИ ПОИСКА QR
  // =====================================================

  function onScanFailure(error) {

    /*
      Здесь специально ничего не показываем.

      Пока камера ищет QR-код,
      библиотека постоянно сообщает,
      что QR пока не найден.
    */

  }


  // =====================================================
  // СООБЩЕНИЯ
  // =====================================================

  function showStatus(
    elementId,
    message,
    type
  ) {

    const element =
      document.getElementById(elementId);


    if (!element) {

      return;

    }


    element.className =
      'status ' + type;


    element.textContent =
      message;

  }


  // =====================================================
  // ENTER В ПОЛЕ ПАРОЛЯ
  // =====================================================

  document
    .getElementById('password')
    .addEventListener(
      'keydown',
      function(event) {

        if (event.key === 'Enter') {

          login();

        }

      }
    );

</script>

</body>
</html>
