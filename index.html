<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>QR Сканер</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 20px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.1);
      margin-bottom: 16px;
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 13px;
      font-size: 17px;
      border: 1px solid #bbb;
      border-radius: 7px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: none;
      border-radius: 7px;
      background: #1976d2;
      color: white;
    }

    button:disabled {
      opacity: .6;
    }

    .hidden {
      display: none !important;
    }

    .session-info {
      text-align: center;
      line-height: 1.6;
      font-size: 17px;
    }

    .counter {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin: 12px 0;
    }

    #reader {
      width: 100%;
      margin-top: 12px;
    }

    #reader video {
      width: 100% !important;
      border-radius: 10px;
    }

    .loading {
      text-align: center;
      margin-top: 10px;
      color: #555;
    }

    .status {
      text-align: center;
      padding: 12px;
      border-radius: 7px;
      margin-top: 12px;
      font-size: 16px;
      font-weight: bold;
    }

    .success {
      background: #d9f7df;
      color: #176b2c;
    }

    .error {
      background: #ffdede;
      color: #a00000;
    }

    .warning {
      background: #fff0c2;
      color: #795600;
    }

    .info {
      background: #e0ecff;
      color: #174d9c;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>QR Сканер</h1>


  <!-- ============================= -->
  <!-- ПАРОЛЬ -->
  <!-- ============================= -->

  <div id="loginScreen" class="card">

    <label for="password">
      Пароль
    </label>

    <input
      id="password"
      type="password"
      placeholder="Введите пароль"
      autocomplete="off"
    >

    <button
      id="loginButton"
      onclick="login()"
    >
      Войти
    </button>

    <div id="loginStatus"></div>

  </div>


  <!-- ============================= -->
  <!-- ИСПОЛНИТЕЛЬ -->
  <!-- ============================= -->

  <div
    id="workerScreen"
    class="card hidden"
  >

    <h2>
      Данные исполнителя
    </h2>

    <label for="executor">
      Имя исполнителя
    </label>

    <input
      id="executor"
      type="text"
      placeholder="Введите имя"
      autocomplete="off"
    >

    <label for="du">
      ДУ прибора
    </label>

    <input
      id="du"
      type="text"
      placeholder="Введите ДУ"
      autocomplete="off"
    >

    <button
      onclick="startScanner()"
    >
      Начать сканирование
    </button>

    <div id="workerStatus"></div>

  </div>


  <!-- ============================= -->
  <!-- СКАНЕР -->
  <!-- ============================= -->

  <div
    id="scannerScreen"
    class="hidden"
  >

    <div class="card">

      <div class="session-info">

        Исполнитель:
        <strong id="executorDisplay"></strong>

        <br>

        ДУ:
        <strong id="duDisplay"></strong>

      </div>


      <div class="counter">

        Отсканировано:
        <span id="counter">0</span>

      </div>


      <div id="reader"></div>


      <div
        id="scannerLoading"
        class="loading"
      >
        Запуск камеры...
      </div>


      <div id="scanStatus"></div>

    </div>

  </div>

</div>


<script>


// =====================================================
// GOOGLE APPS SCRIPT
// =====================================================

const GOOGLE_SCRIPT_URL =
  'https://script.google.com/macros/s/AKfycby5GSmAT8_eINQTh7ToOjli0urAyAmk8L2Ia1nkkNRrTXs-gyS_A08-QzMpgcPveWC2zA/exec';


// =====================================================
// ОСНОВНЫЕ ПЕРЕМЕННЫЕ
// =====================================================

let executor = '';

let du = '';

let scanner = null;

let scanCount = 0;

let processingScan = false;

let lastScannedText = '';

let lastScanTime = 0;


// =====================================================
// JSONP
// =====================================================

function callGoogleScript(
  action,
  data = {},
  timeoutMs = 12000
) {

  return new Promise(function(resolve, reject) {

    const callbackName =
      'googleCallback_' +
      Date.now() +
      '_' +
      Math.floor(
        Math.random() * 100000
      );


    const script =
      document.createElement('script');


    let finished = false;


    function cleanup() {

      if (script.parentNode) {

        script.parentNode.removeChild(
          script
        );

      }


      try {

        delete window[callbackName];

      } catch (e) {

        window[callbackName] =
          undefined;

      }

    }


    const timer =
      setTimeout(function() {

        if (finished) {
          return;
        }

        finished = true;

        cleanup();

        reject(
          new Error('Timeout')
        );

      }, timeoutMs);


    window[callbackName] =
      function(result) {

        if (finished) {
          return;
        }

        finished = true;

        clearTimeout(timer);

        cleanup();

        resolve(result);

      };


    const params =
      new URLSearchParams();


    params.set(
      'action',
      action
    );


    params.set(
      'callback',
      callbackName
    );


    Object.keys(data).forEach(
      function(key) {

        params.set(
          key,
          data[key]
        );

      }
    );


    script.src =
      GOOGLE_SCRIPT_URL +
      '?' +
      params.toString();


    script.async = true;


    script.onerror =
      function() {

        if (finished) {
          return;
        }

        finished = true;

        clearTimeout(timer);

        cleanup();

        reject(
          new Error('Network error')
        );

      };


    document.head.appendChild(
      script
    );

  });

}


// =====================================================
// ВХОД
// =====================================================

async function login() {

  const password =
    document
      .getElementById('password')
      .value
      .trim();


  if (!password) {

    showStatus(
      'loginStatus',
      'Введите пароль.',
      'error'
    );

    return;

  }


  const button =
    document
      .getElementById('loginButton');


  button.disabled = true;

  button.textContent =
    'Проверка...';


  try {

    const result =
      await callGoogleScript(
        'checkPassword',
        {
          password: password
        },
        12000
      );


    if (
      result &&
      result.success === true
    ) {

      document
        .getElementById(
          'loginScreen'
        )
        .classList
        .add('hidden');


      document
        .getElementById(
          'workerScreen'
        )
        .classList
        .remove('hidden');


      document
        .getElementById(
          'password'
        )
        .value = '';


    } else {

      showStatus(
        'loginStatus',
        'Неверный пароль.',
        'error'
      );

    }


  } catch (error) {

    showStatus(
      'loginStatus',
      'Нет связи со скриптом. Повторите попытку.',
      'error'
    );

  }


  button.disabled = false;

  button.textContent =
    'Войти';

}


// =====================================================
// НАЧАЛО СКАНИРОВАНИЯ
// =====================================================

function startScanner() {

  executor =
    document
      .getElementById('executor')
      .value
      .trim();


  du =
    document
      .getElementById('du')
      .value
      .trim();


  if (!executor) {

    showStatus(
      'workerStatus',
      'Введите имя исполнителя.',
      'error'
    );

    return;

  }


  if (!du) {

    showStatus(
      'workerStatus',
      'Введите ДУ прибора.',
      'error'
    );

    return;

  }


  document
    .getElementById(
      'workerScreen'
    )
    .classList
    .add('hidden');


  document
    .getElementById(
      'scannerScreen'
    )
    .classList
    .remove('hidden');


  document
    .getElementById(
      'executorDisplay'
    )
    .textContent =
    executor;


  document
    .getElementById(
      'duDisplay'
    )
    .textContent =
    du;


  startQrScanner();

  loadCounter();

}


// =====================================================
// ЗАГРУЗКА СЧЁТЧИКА
// =====================================================

async function loadCounter() {

  try {

    const result =
      await callGoogleScript(
        'getScanCount',
        {},
        10000
      );


    if (
      result &&
      result.success === true
    ) {

      scanCount =
        Number(result.count) || 0;


      updateCounter();

    }

  } catch (error) {

    // Ничего не делаем.
    // Камера продолжает работать.

  }

}


// =====================================================
// ОБНОВЛЕНИЕ СЧЁТЧИКА
// =====================================================

function updateCounter() {

  document
    .getElementById(
      'counter'
    )
    .textContent =
    scanCount;

}


// =====================================================
// КАМЕРА
// =====================================================

async function startQrScanner() {

  if (scanner) {

    try {

      await scanner.stop();

    } catch (e) {}

    scanner = null;

  }


  scanner =
    new Html5Qrcode(
      'reader'
    );


  const config = {

    fps: 8,

    qrbox: function(
      width,
      height
    ) {

      const size =
        Math.floor(
          Math.min(
            width,
            height
          ) * 0.65
        );


      return {
        width: size,
        height: size
      };

    },

    aspectRatio: 1.0,

    disableFlip: false

  };


  try {

    await scanner.start(

      {
        facingMode: {
          exact: 'environment'
        }
      },

      config,

      onScanSuccess,

      onScanFailure

    );


  } catch (error) {

    try {

      await scanner.start(

        {
          facingMode: 'environment'
        },

        config,

        onScanSuccess,

        onScanFailure

      );


    } catch (secondError) {

      document
        .getElementById(
          'scannerLoading'
        )
        .textContent =
        'Не удалось запустить камеру.';


      showStatus(
        'scanStatus',
        'Не удалось получить доступ к камере.',
        'error'
      );

      return;

    }

  }


  document
    .getElementById(
      'scannerLoading'
    )
    .classList
    .add('hidden');


  showStatus(
    'scanStatus',
    'Камера готова. Наведите её на QR-код.',
    'info'
  );

}


// =====================================================
// УСПЕШНОЕ СКАНИРОВАНИЕ
// =====================================================

async function onScanSuccess(
  decodedText
) {

  const serialNumber =
    String(
      decodedText || ''
    ).trim();


  if (!serialNumber) {
    return;
  }


  const now =
    Date.now();


  /*
   * Камера может отдавать один QR
   * много раз подряд.
   */

  if (
    serialNumber ===
      lastScannedText &&
    now - lastScanTime < 3000
  ) {

    return;

  }


  lastScannedText =
    serialNumber;

  lastScanTime =
    now;


  if (processingScan) {
    return;
  }


  processingScan = true;


  showStatus(
    'scanStatus',
    'Обрабатываем ' +
    serialNumber +
    '...',
    'info'
  );


  try {

    const result =
      await callGoogleScript(

        'addScan',

        {
          serialNumber:
            serialNumber,

          du:
            du,

          executor:
            executor
        },

        10000

      );


    /*
     * ==========================================
     * УНИКАЛЬНЫЙ НОМЕР
     * ==========================================
     */

    if (
      result &&
      result.success === true
    ) {

      scanCount =
        Number(
          result.count
        ) || scanCount + 1;


      updateCounter();


      showStatus(
        'scanStatus',
        '✓ Код добавлен: ' +
        result.serialNumber,
        'success'
      );


      processingScan = false;

      return;

    }


    /*
     * ==========================================
     * ДУБЛЬ
     * ==========================================
     */

    if (
      result &&
      result.duplicate === true
    ) {

      if (
        typeof result.count !==
        'undefined'
      ) {

        scanCount =
          Number(
            result.count
          );

        updateCounter();

      }


      showStatus(
        'scanStatus',
        '⚠ Данный серийный номер уже был отсканирован.',
        'warning'
      );


      processingScan = false;

      return;

    }


    /*
     * ==========================================
     * ОШИБКА
     * ==========================================
     */

    showStatus(
      'scanStatus',
      result &&
      result.message
        ? result.message
        : 'Ошибка при обработке кода.',
      'error'
    );


    processingScan = false;


  } catch (error) {

    /*
     * ==========================================
     * ОТВЕТ НЕ ПРИШЁЛ
     * ==========================================
     *
     * Очень важная часть.
     *
     * Номер мог уже попасть в таблицу,
     * а ответ Apps Script просто не успел
     * вернуться на iPhone.
     *
     * Поэтому НЕ просим пользователя
     * сканировать QR повторно.
     */

    showStatus(
      'scanStatus',
      'Проверяем результат...',
      'info'
    );


    /*
     * Даём Apps Script немного времени
     * закончить запись.
     */

    await sleep(1000);


    /*
     * Несколько раз обновляем счётчик.
     * Если он увеличился — запись произошла.
     */

    let confirmed = false;


    for (
      let attempt = 0;
      attempt < 3;
      attempt++
    ) {

      try {

        const counterResult =
          await callGoogleScript(
            'getScanCount',
            {},
            5000
          );


        if (
          counterResult &&
          counterResult.success === true
        ) {

          const newCount =
            Number(
              counterResult.count
            );


          if (
            newCount > scanCount
          ) {

            scanCount =
              newCount;

            updateCounter();

            confirmed = true;

            break;

          }

        }

      } catch (e) {

        // Пробуем ещё раз.

      }


      await sleep(700);

    }


    if (confirmed) {

      showStatus(
        'scanStatus',
        '✓ Код добавлен: ' +
        serialNumber,
        'success'
      );


      processingScan = false;

      return;

    }


    /*
     * Если счётчик не изменился,
     * не отправляем автоматически
     * повторный addScan.
     *
     * Иначе можно получить ненужную
     * повторную запись/гонку запросов.
     */

    showStatus(
      'scanStatus',
      'Ответ от скрипта задерживается. Проверьте таблицу — повторно сканировать пока не нужно.',
      'warning'
    );


    processingScan = false;

  }

}


// =====================================================
// ЗАДЕРЖКА
// =====================================================

function sleep(ms) {

  return new Promise(
    function(resolve) {

      setTimeout(
        resolve,
        ms
      );

    }
  );

}


// =====================================================
// QR НЕ НАЙДЕН
// =====================================================

function onScanFailure(error) {

  // Ничего не показываем.
  // Это нормальная работа сканера.

}


// =====================================================
// СТАТУС
// =====================================================

function showStatus(
  elementId,
  message,
  type
) {

  const element =
    document.getElementById(
      elementId
    );


  if (!element) {
    return;
  }


  element.className =
    'status ' + type;


  element.textContent =
    message;

}


// =====================================================
// ENTER В ПАРОЛЕ
// =====================================================

document
  .getElementById('password')
  .addEventListener(
    'keydown',
    function(event) {

      if (
        event.key === 'Enter'
      ) {

        login();

      }

    }
  );


</script>

</body>
</html>
